// Skaar default configuration. Executed by the engine at startup before the
// user's skaarconfig.cfg. Original file (GPLv2-or-later, see COPYING.txt).

unbindall

// movement
bind w "+forward"
bind s "+back"
bind a "+moveleft"
bind d "+moveright"
bind SPACE "+moveup"
bind CTRL "+movedown"
bind SHIFT "+speed"

// actions
bind MOUSE1 "+attack"
bind MOUSE2 "+zoom"
bind r "sk_restart"
bind i "sk_insights"
bind TAB "+scores"
bind ESCAPE "togglemenu"
bind F12 "screenshotJPEG"

// input: raw mouse, no acceleration (see docs/sensitivity.md once written)
seta in_mouse "1"
seta cl_mouseAccel "0"
seta m_filter "0"
seta m_pitch "0.022"
seta m_yaw "0.022"
seta sensitivity "2"

// no pk3 files yet: pure server checks would only warn
seta sv_pure "0"
// no bot data until P6; botlib otherwise errors every frame
seta bot_enable "0"

// network/simulation: the local server ticks and snapshots at 125 Hz (matches pmove_msec 8)
seta sv_fps "125"
seta snaps "125"
seta rate "100000"
seta cl_maxpackets "125"

// full-resolution textures
seta r_picmip "0"

// display and pacing
seta com_maxfps "0"
seta r_swapInterval "0"
seta cl_renderer "opengl2"
// fullscreen at the desktop resolution; r_customwidth/height apply only with r_mode -1
seta r_mode "-2"
seta r_customwidth "1600"
seta r_customheight "900"
seta r_fullscreen "1"
seta con_scale "1.5"
